name: Actualisation Temps Zéro

on:
  schedule:
    - cron: '*/15 * * * *' # S'exécute toutes les 15 minutes
  workflow_dispatch: # Permet de le lancer manuellement si besoin

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Installer les modules
      run: pip install requests

    - name: Exécuter le script de collecte
      run: python update_gold_data.py

    - name: Enregistrer les modifications sur GitHub
      run: |
        git config --global user.name 'Robot Gold Trader'
        git config --global user.email 'robot@github.com'
        git add donnees_temps_zero.json
        git commit -m "Mise à jour données temps zéro" || exit 0
        git push
